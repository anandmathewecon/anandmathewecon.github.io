/* sinh-arcsinh density of Jones & Pewsey, on a fixed grid, normalised,
   with every displayed moment integrated on that same grid */
const SAS_N=800, SAS_LO=-16, SAS_HI=16, SAS_DY=(SAS_HI-SAS_LO)/SAS_N;
const SAS_Y=(()=>{const a=[];for(let k=0;k<=SAS_N;k++)a.push(SAS_LO+SAS_DY*k);return a;})();
function sasShape(eps,delta){
  const f=new Array(SAS_N+1);
  for(let k=0;k<=SAS_N;k++){const y=SAS_Y[k],s=delta*Math.asinh(y)-eps;
    f[k]=pdfN(Math.sinh(s))*delta*Math.cosh(s)/Math.sqrt(1+y*y);}
  let tot=0;for(let k=0;k<=SAS_N;k++)tot+=f[k];tot*=SAS_DY;
  for(let k=0;k<=SAS_N;k++)f[k]/=tot;
  let m=0;for(let k=0;k<=SAS_N;k++)m+=SAS_Y[k]*f[k];m*=SAS_DY;
  let v2=0;for(let k=0;k<=SAS_N;k++){const d=SAS_Y[k]-m;v2+=d*d*f[k];}v2*=SAS_DY;
  const sd=Math.sqrt(v2);
  let s3=0,s4=0;for(let k=0;k<=SAS_N;k++){const z=(SAS_Y[k]-m)/sd;s3+=z*z*z*f[k];s4+=z*z*z*z*f[k];}

  let cum=0,med=m;
  for(let k=0;k<=SAS_N;k++){const c0=cum;cum+=f[k]*SAS_DY;
    if(c0<0.5&&cum>=0.5){med=SAS_Y[k]-SAS_DY*(cum-0.5)/(f[k]*SAS_DY||1);break;}}
  return {f:f,m:m,sd:sd,skew:s3,kurt:s4,med:med};
}

      g.zform.textContent=i>=4?
        "z = (x − μ) / σ        SAT: (1,300 − 1,024) / 229 = 1.21        ACT: (29 − 19.4) / 5.9 = 1.63":
        "z = (x − μ) / σ";
    }
    op(g.zform,(tests&&i>=2)?1:0);
  },
  paintPanel(P,q,i){
    const t=q?ACT:SAT,s=P.st,X=v=>RX0+(v-s.lo)/(s.hi-s.lo)*(RX1-RX0);
    const sigp=s.sig*(RX1-RX0)/(s.hi-s.lo),cxp=X(s.mu);
    P.axis.setAttribute("y1",s.base);P.axis.setAttribute("y2",s.base);
    const zL=Math.max(-4,(RX0-140-cxp)/sigp), zR=Math.min(4,(RX1+140-cxp)/sigp);
    P.curve.setAttribute("d",curveD(cxp,sigp,s.base,s.h,zL,zR));
    const zmark=(t.x-t.mu)/t.sd, xm=cxp+zmark*sigp;
    P.mark.setAttribute("x1",xm);P.mark.setAttribute("x2",xm);
    P.mark.setAttribute("y1",s.base-s.h*Math.exp(-(zmark*zmark)/2)-30);P.mark.setAttribute("y2",s.base);
    P.markLab.setAttribute("x",xm);
    P.markLab.setAttribute("y",s.base-s.h*Math.exp(-(zmark*zmark)/2)-40);
    P.markLab.textContent=s.mode===0?t.lab+" "+t.x.toLocaleString("en-US"):
      s.mode===1?(q?"+9.6":"+276"):(i>=4?t.lab+"  z = "+f2(zmark):t.lab);
    P.name.setAttribute("y",s.base-30);P.sub.setAttribute("y",s.base-8);
    P.sub.textContent=s.mode===0?"mean "+t.mu.toLocaleString("en-US")+" · SD "+t.sd:
      s.mode===1?"deviation from the mean":s.mode===2?"z = deviation / SD":"";
    op(P.name,s.mode===3?0:1);op(P.sub,s.mode===3?0:1);
    clear(P.ticks);
    const step=niceStep((s.hi-s.lo)/8);
    for(let v=Math.ceil(s.lo/step)*step;v<=s.hi+1e-9;v+=step){const x=X(v);
      if(x<RX0-25||x>RX1+25)continue;
      E("line",{x1:x,x2:x,y1:s.base,y2:s.base+7,stroke:NU,"stroke-width":1.5},P.ticks);
      T(x,s.base+28,neg((s.mode===1&&v>0?"+":"")+v.toLocaleString("en-US")),{s:14,f:MU,m:1,p:P.ticks});}
    const sh=i>=5;
    if(sh){P.shade.setAttribute("d",curveD(cxp,sigp,s.base,s.h,-4,zmark)+
      "L"+xm.toFixed(1)+","+s.base+" L"+(cxp-4*sigp).toFixed(1)+","+s.base+" Z");}
    P.shade.setAttribute("opacity",sh?(q?.18:.28):0);
    op(P.pct,sh?1:0);P.pct.setAttribute("x",cxp-1.35*sigp);P.pct.setAttribute("y",s.base-46);
    P.pct.textContent=t.lab+": "+(Phi(zmark)*100).toFixed(1)+"% below";
    if(s.mode===3&&i>=4)P.markLab.setAttribute("y",s.base-s.h*Math.exp(-(zmark*zmark)/2)-40-(q?0:26));
  }
});

/* =====================================================================
   deck controller
   ===================================================================== */
let si=0, pi=0, built=null;
const tabs=document.getElementById("tabs"), dots=document.getElementById("dots");
SCENES.forEach((s,k)=>{
  const b=document.createElement("button");
  b.textContent=s.tab; b.onclick=e=>{e.stopPropagation();go(k,0);};
  tabs.appendChild(b);
});
function go(s,p){
  hideTip(); stopAnim(); hlRows(null,false);
  if(s!==si||built===null){
    si=s; while(sv.firstChild) sv.removeChild(sv.firstChild);
    ctrlsEl.innerHTML=SCENES[si].ctrls||"";
    ctrlsEl.classList.toggle("show",!!SCENES[si].ctrls);
    built=SCENES[si].build();
  }
  const S=SCENES[si];
  pi=Math.max(0,Math.min(S.steps.length-1,p));
  setTable(S.table?S.table.call(S,pi):null);
  S.render.call(S,built,pi);
  const st=S.steps[pi];
  document.getElementById("ttl").textContent=typeof st.t==="function"?st.t():st.t;
  document.getElementById("cap").innerHTML=typeof st.c==="function"?st.c():st.c;
  [...tabs.children].forEach((b,k)=>b.setAttribute("aria-current",k===si?"true":"false"));
  document.getElementById("pos").innerHTML=S.pos?S.pos(pi):
    "animation "+(si+1)+" of "+SCENES.length+"  ·  step "+(pi+1)+" of "+S.steps.length;
  dots.innerHTML="";
  S.steps.forEach((_,k)=>{const d=document.createElement("i");
    if(k<=pi)d.className="on"; dots.appendChild(d);});
}
function step(d){
  const S=SCENES[si];
  if(pi+d<0){ if(si>0) go(si-1,SCENES[si-1].steps.length-1); return; }
  if(pi+d>=S.steps.length){ if(si<SCENES.length-1) go(si+1,0); return; }
  go(si,pi+d);
}
document.addEventListener("click",e=>{ if(e.target.closest(".noadv"))return; step(1); });
document.addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){e.preventDefault();step(1);}
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();step(-1);}
  else if(e.key>="1"&&e.key<="5"){const k=+e.key-1; if(k<SCENES.length) go(k,0);}
  else if(e.key==="d"||e.key==="D"){const S=SCENES[si]; if(S.reseed) S.reseed();}
  else if(e.key==="f"||e.key==="F"){
    document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}
});
/* per-scene controls */
ctrlsEl.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b)return; e.stopPropagation();
  const S=SCENES[si]; if(S.act) S.act.call(S,b.dataset.act,b);
});
go(0,0);
})();
</script>
