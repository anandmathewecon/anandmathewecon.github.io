<style>

const C={blue:"#0021A5",soft:"#4A6FD4",orange:"#FA4616",ink:"#4B5563",grey:"#9AA1AE",pale:"#E5E7EB",dark:"#1F2937"};

const HALO={stroke:"#fff","stroke-width":5,"paint-order":"stroke","stroke-linejoin":"round"};

function rng(seed){let s=seed>>>0;return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function normal(r){let u=0,v=0;while(u===0)u=r();v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}

function button(label,fn,on){const b=document.createElement("button");b.textContent=label;if(on)b.classList.add("on");b.onclick=()=>fn(b);ctl.appendChild(b);return b;}

const infoEl=document.getElementById("info"),infoBtn=document.getElementById("infoBtn");

let lastNow="";function explain(h){if(h===lastNow)return;lastNow=h;document.getElementById("iNow").innerHTML=h;}
// colour by size: soft blue (1,200 sq ft) to orange (3,000 sq ft or more)
const SOFT=[74,111,212],ORNG=[250,70,22];
function sizeRGB(q){const t=Math.min(1,Math.max(0,(q-1200)/1800));return SOFT.map((v,i)=>v+(ORNG[i]-v)*t);}
function rgb(a){return "rgb("+a.map(Math.round).join(",")+")";}
function sizeColor(q){return rgb(sizeRGB(q));}
// OLS by the normal equations (columns of X include the intercept)
function ols(X,y){const k=X.length,n=y.length;const A=[...Array(k)].map(()=>Array(k+1).fill(0));
  for(let a=0;a<k;a++){for(let b=0;b<k;b++){let s=0;for(let i=0;i<n;i++)s+=X[a][i]*X[b][i];A[a][b]=s;}let s=0;for(let i=0;i<n;i++)s+=X[a][i]*y[i];A[a][k]=s;}
  for(let c=0;c<k;c++){let p=c;for(let r=c+1;r<k;r++)if(Math.abs(A[r][c])>Math.abs(A[p][c]))p=r;[A[c],A[p]]=[A[p],A[c]];
    for(let r=0;r<k;r++)if(r!==c){const f=A[r][c]/A[c][c];for(let q=c;q<=k;q++)A[r][q]-=f*A[c][q];}}
  const beta=A.map((r,i)=>r[k]/r[i]);const fit=y.map((_,i)=>beta.reduce((s,bb,a)=>s+bb*X[a][i],0));return {beta,fit};}
const N=H.length, PR=H.map(h=>h[0]), BD=H.map(h=>h[1]), SQ=H.map(h=>h[2]);
const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
const ONE=Array(N).fill(1), YBAR=mean(PR), BBAR=mean(BD);
const M1=ols([ONE,BD],PR), M2=ols([ONE,BD,SQ],PR);
const f1=(v,d)=>v.toFixed(d===undefined?1:d);

// a house icon one unit wide, centred near (0,0)
const HOUSE="M-0.62,0.03 L0,-0.5 L0.62,0.03 Z M-0.47,0 L0.47,0 L0.47,0.52 L-0.47,0.52 Z", DOOR="M-0.09,0.52 L-0.09,0.27 L0.09,0.27 L0.09,0.52 Z";

/* =====================================================================
   NOT SHOWN since Nov 2: where the $62,000 comes from (houses)
   ===================================================================== */
const S0={};
S0.build=function(){
  header("Where the $62,000 comes from","88 houses sold in the Boston area, 1990. Size is omitted from the regression of price on bedrooms.",1);
  setInfo({study:"88 houses sold in the Boston area in 1990. Each dot is one house: across is its number of bedrooms (spread a little so the dots do not overlap), up is its sale price or its size. Colour shows size: blue for small houses, orange for big ones. Prices are in $1000s.",
    todo:"Click the four steps in order. Hover over a house for its details, and over the bar pieces on the right.",
    look:"Step 1: the simple regression says +62.0 per bedroom. Step 2: houses with more bedrooms are bigger, about 365 sq ft per bedroom. Step 3: holding size constant, the slope is only 15.2. Step 4: the gap, 46.7, is the size slope (0.128) times 365: the estimated omitted variable bias."});
  const AUX=ols([ONE,BD],SQ);
  const b1=M1.beta[1],c1=M2.beta[1],c2=M2.beta[2],d1=AUX.beta[1],SQBAR=mean(SQ);
  // the split uses the rounded numbers shown on the slide: 0.128 x 365 = 46.7
  const C1r=+c1.toFixed(1),C2r=+c2.toFixed(3),D1r=Math.round(d1),BIAS=+(C2r*D1r).toFixed(1);
  const X0=150,X1=880,Y0=740,Y1=180;
  const bx=v=>X0+(v-1.4)/(7.6-1.4)*(X1-X0);
  const yP=v=>Y0-(v-100)/(750-100)*(Y0-Y1), yS=v=>Y0-(v-1000)/(4000-1000)*(Y0-Y1);
  const JIT=H.map((h,i)=>((i*37)%9-4)*0.055);
  const gAx=el("g",{});
  el("line",{x1:X0,y1:Y0,x2:X1,y2:Y0,stroke:C.grey,"stroke-width":2},gAx);el("line",{x1:X0,y1:Y0,x2:X0,y2:Y1,stroke:C.grey,"stroke-width":2},gAx);
  [2,3,4,5,6,7].forEach(b=>txt(bx(b),Y0+28,String(b),{"font-size":17,fill:C.grey,"text-anchor":"middle"},gAx));
  txt((X0+X1)/2,Y0+62,"bedrooms",{"font-size":20,"text-anchor":"middle"},gAx);
  const gYP=el("g",{}),gYS=el("g",{});
  [200,300,400,500,600,700].forEach(v=>txt(X0-10,yP(v)+6,"$"+v+"k",{"font-size":16,fill:C.grey,"text-anchor":"end"},gYP));
  [1500,2000,2500,3000,3500].forEach(v=>txt(X0-10,yS(v)+6,fmtInt(v),{"font-size":16,fill:C.grey,"text-anchor":"end"},gYS));
  const yl=(s,g)=>txt(X0-82,(Y0+Y1)/2,s,{"font-size":20,"text-anchor":"middle",transform:"rotate(-90 "+(X0-82)+" "+(Y0+Y1)/2+")"},g);
  yl("sale price",gYP);yl("size (sq ft)",gYS);
  const lA=el("line",{stroke:C.dark,"stroke-width":3}),lB=el("line",{stroke:C.dark,"stroke-width":3}),lC=el("line",{stroke:C.blue,"stroke-width":4});
  const tA=txt(0,0,"",{"font-size":20,"font-weight":700,fill:C.dark}),tB=txt(0,0,"",{"font-size":20,"font-weight":700,fill:C.dark}),tC=txt(0,0,"",{"font-size":20,"font-weight":700,fill:C.blue});
  [tA,tB,tC].forEach(t=>Object.entries(HALO).forEach(([k,v])=>t.setAttribute(k,v)));
  const gP=el("g",{});
  const pts=H.map((h,i)=>{const c=el("circle",{r:6.5,fill:sizeColor(SQ[i]),"fill-opacity":0.8,stroke:"#fff","stroke-width":1},gP);hoverTip(c,()=>houseTip(i));return c;});
  // right panel: the decomposition
  const RX=990,gR=el("g",{});
  el("rect",{x:RX-20,y:160,width:590,height:560,rx:12,fill:"#fff",stroke:"#D4D8DE","stroke-width":1.5},gR);
  txt(RX,200,"Split the simple slope",{"font-size":22,"font-weight":700,fill:C.blue},gR);
  const lines=[
    {s:"simple slope (price on bedrooms): "+f1(b1),y:250},
    {s:"extra size per bedroom: "+fmtInt(d1)+" sq ft",y:295},
    {s:"slope holding size constant: "+f1(c1),y:340},
    {s:"size slope (per sq ft, $1000s): "+c2.toFixed(3),y:385},
    {s:"estimated bias = "+C2r.toFixed(3)+" × "+D1r+" = "+f1(BIAS),y:445},
    {s:f1(C1r)+" + "+f1(BIAS)+" = "+f1(C1r+BIAS)+", about the simple slope "+f1(b1),y:490}];
  const LT=lines.map(L=>txt(RX,L.y,L.s,{"font-size":20,fill:C.ink},gR));
  LT.forEach(t=>{t.style.transition="opacity .5s";t.style.opacity=0;});
  const BW=520,sc=BW/b1;
  const barC=el("rect",{x:RX,y:560,width:0,height:46,rx:4,fill:C.blue},gR),barB=el("rect",{x:RX,y:560,width:0,height:46,rx:4,fill:C.orange},gR);
  const vC=txt(RX,591,"",{"font-size":19,fill:"#fff","font-weight":700,"text-anchor":"middle"},gR),vB=txt(RX,591,"",{"font-size":19,fill:"#fff","font-weight":700,"text-anchor":"middle"},gR);
  const nC=txt(RX,640,"a bedroom",{"font-size":17,fill:C.blue},gR),nB=txt(RX,640,"the extra space that comes with it",{"font-size":17,fill:C.orange},gR);

  hoverTip(barB,()=>"<b>Estimated omitted variable bias</b><br>size slope × extra size per bedroom<br>= "+C2r.toFixed(3)+" × "+D1r+" = "+f1(BIAS));
  const st={step:1,v:0,tv:0,a:1,ta:1,b:0,tb:0,c:0,tc:0,bar:0,tbar:0};
  makeCaption();
  function go(n){st.step=n;st.tv=n===2?1:0;st.ta=n===2?0:(n>=3?0.25:1);st.tb=n===2?1:0;st.tc=n>=3?1:0;st.tbar=n>=4?1:0;
    const vis=[[0],[0,1],[0,1,2,3],[0,1,2,3,4,5]][n-1];LT.forEach((t,k)=>t.style.opacity=vis.includes(k)?1:0);
    LT.forEach((t,k)=>{t.setAttribute("fill",(n===4&&k>=4)?C.orange:C.ink);t.setAttribute("font-weight",(n===4&&k>=4)?700:400);});}
  const sb=[button("1 · Price on bedrooms",()=>go(1),true),button("2 · Size on bedrooms",()=>go(2)),button("3 · Hold size constant",()=>go(3)),button("4 · Split the 62.0",()=>go(4))];group(sb);
  function setLine(l,t,f,yf,lab,op,pos){l.setAttribute("x1",bx(1.6));l.setAttribute("y1",yf(f(1.6)));l.setAttribute("x2",bx(7.4));l.setAttribute("y2",yf(f(7.4)));l.style.opacity=op.toFixed(3);
    t.textContent=lab;t.setAttribute("x",bx(pos)+12);t.setAttribute("y",yf(f(pos))-14);t.style.opacity=op.toFixed(3);}
  S0.frame=function(dt){
    const k=ez(dt,0.38);["v","a","b","c","bar"].forEach(q=>st[q]+=(st["t"+q]-st[q])*k);

    if(s===4){caption("62.0 = 15.2 + 0.128 × 365: the estimated bias is about 46.7.",C.orange);explain("Each extra bedroom comes with about 365 more sq ft, and each sq ft is associated with $128 more. So 0.128 × 365 = 46.7 of the 62.0 is the extra space, not the bedroom. That 46.7 is our estimate of the omitted variable bias.");}
  };
  go(1);

   ===================================================================== */

  makeCaption(856);
  let cs=CASES[0],step=1,dx=4,tgt=sim(cs,true),cur={X:tgt.X.slice(),Y:tgt.Y.slice()};
  const sw=v=>v>0?"+":"−",fm=v=>(v>0?"+":v<0?"−":"")+Math.abs(+v.toFixed(1));
  // the regression's line for the share of dark, so the icons match the 0.25 per unit on screen
  const share=(c,x)=>step===1?.5:Math.min(1,Math.max(0,.5+DELTA*c.sg*(x-5)));
  function draw(){const c=cs,x0=3,x=3+dx,bias=c.b2*DELTA*c.sg,tot=c.b+bias;
    const fT=v=>50+c.b*(v-5),fS=v=>50+tot*(v-5);
    mT.setAttribute("cx",px(x));mT.setAttribute("cy",py(fT(x)));mS.setAttribute("cx",px(x));mS.setAttribute("cy",py(fS(x)));
    paint(r0,x0,share(c,x0));paint(r1,x,share(c,x));
    ln[0].textContent="Ideal: each unit of X changes Y by "+fm(c.b)+". That is the causal effect.";
    ln[1].textContent=step>=3?"Each unit of X comes with δ₁ = "+(c.sg>0?"+":"−")+"0.25: "+(c.sg>0?"25% more":"25% fewer")+" dark ("+c.hi+").":"";
    ln[2].textContent=step>=4?"Dark vs pale, at the same X: β₂ = "+fm(c.b2)+" on Y.":"";
    ln[3].textContent=step>=5?"Bias = "+fm(c.b2)+" × "+(c.sg>0?"+":"−")+"0.25 = "+fm(bias)+", so the slope is "+fm(tot)+", not "+fm(c.b)+".":"";
    tBar.textContent="Increase X by "+(+dx.toFixed(1))+": change in Y";
    [c.b*dx,bias*dx,tot*dx].forEach((v,i)=>{const B=bars[i],on=i===0||step>=5,w=Math.abs(v)*PX;B.R.setAttribute("x",v>=0?ZX:ZX-w);B.R.setAttribute("width",w);B.v.textContent=fm(v);B.v.setAttribute("x",v>=0?ZX+w+8:ZX+8);[B.R,B.v,B.t].forEach(e=>e.style.opacity=on?1:0.15);});
  }
  function go(n){step=n;const c=cs,bias=c.b2*DELTA*c.sg,tot=c.b+bias,same=bias>0,dir=same?"upward":"downward",col=same?C.orange:C.blue;
    if(n>=6)VISITED.add(c.btn);
    tgt=sim(c,n===1);
    tX.textContent=c.x+" (X)  →";tY.textContent=c.y+" (Y)  →";
    bX.textContent=c.x;bZ.textContent=c.z+" (omitted)";bY.textContent=c.y;bZ.setAttribute("font-size",c.z.length>16?15:18);
    sZX.textContent=n>=3?sw(c.sg):"";sZY.textContent=n>=4?sw(c.b2):"";
    fade(dZX,n>=3?1:.15);fade(dZY,n>=4?1:.15);
    tLeg.textContent="At this X, the mix of people. Dark: "+c.hi+". Pale: "+c.lo+".";
    gCoin.style.opacity=n===1?1:0;tCoin.textContent=n===1?"a coin decides X":"no coin: X is chosen";tCoin.setAttribute("x",n===1?X0+80:X0+20);
    const line=(l,f)=>{l.setAttribute("x1",px(1.5));l.setAttribute("y1",py(f(1.5)));l.setAttribute("x2",px(8.5));l.setAttribute("y2",py(f(8.5)));};
    line(lT,v=>50+c.b*(v-5));line(lS,v=>50+tot*(v-5));
    const seg=(l,z)=>{const m=5+1.5*c.sg*(z>0?1:-1),a=m-2.5,b=m+2.5,f=v=>50+c.b*(v-5)+c.b2*z/2;l.setAttribute("x1",px(a));l.setAttribute("y1",py(f(a)));l.setAttribute("x2",px(b));l.setAttribute("y2",py(f(b)));};seg(lHi,1);seg(lLo,-1);
    const fH=v=>50+c.b*(v-5)+c.b2/2,fL=v=>50+c.b*(v-5)-c.b2/2,eH=5+1.5*c.sg+2,eL=5-1.5*c.sg-2;
    tHi.textContent=c.hi;tHi.setAttribute("x",px(eH)-30);tHi.setAttribute("y",py(fH(eH))-14);tLo.textContent=c.lo;tLo.setAttribute("x",px(eL)-30);tLo.setAttribute("y",py(fL(eL))+28);
    [lHi,lLo,tHi,tLo].forEach(e=>fade(e,n===4?1:0));
    tT.textContent="causal slope: "+fm(c.b);tT.setAttribute("x",px(c.b>0?6.5:6.5));tT.setAttribute("y",py(50+c.b*1.5)+34);
    tS.textContent="Z left out: "+fm(tot);tS.setAttribute("x",px(1.6));tS.setAttribute("y",py(50+tot*(1.8-5))+(tot>=0?-16:30));
    fade(lS,n>=5?1:0);fade(mS,n>=5?1:0);fade(tS,n>=5?1:0);
    gN.style.display=n>=6?"none":"";gT.style.display=n>=6?"":"none";
    drawTable(c,n>=6);
    if(n===1){para.textContent="Imagine a coin decides "+c.x+". Dark and pale are mixed at every X, so raising X changes nothing else.";caption("The ideal experiment: X changes Y directly, by "+fm(c.b)+" per unit. That is causal.",C.blue);explain("A coin assigns X, as in a randomised experiment. Move the slider: the mix of people stays 50–50 at every X, so the slope is the causal effect.");}
    if(n===2){para.textContent=c.zx;caption("In reality, X is not assigned by a coin: there is selection.",C.dark);explain("Watch the dots move. The people are the same, but now X depends on Z. The blue line is still the causal effect; the data no longer line up with it so simply.");}
    if(n===3){para.textContent="Raising X now also changes who we are looking at. Move the slider and watch the mix of people change.";caption("The groups differ: when X changes, Z changes too. Second sign: "+sw(c.sg)+".",C.orange);explain("In the ideal experiment the mix stayed 50–50. Now it depends on X. This is the correlation between Z and X, and δ₁ is the slope from regressing Z on X.");}
    if(n===4){para.textContent=c.zy;caption("Z has its own effect on Y. First sign: "+sw(c.b2)+".",C.orange);explain("The dashed lines are parallel: within each group, X has the same causal effect. The gap between them is the effect of Z on Y holding X constant, β₂.");}
    if(n===5){para.textContent=c.intu;caption("Slope with Z left out: "+fm(tot)+", against "+fm(c.b)+" in the ideal experiment. "+sw(c.b2)+" × "+sw(c.sg)+": "+dir+" bias.",col);explain("Moving along X now also moves from one group towards the other, so the simple regression adds that change in Z to the effect of X. Move the slider: the gap grows with X, and the bars show the two pieces.");}
    if(n>=6){para.textContent=c.intu;caption("Into the table: Z "+(c.b2>0?"raises":"lowers")+" Y and is "+(c.sg>0?"positively":"negatively")+" correlated with X: "+dir+".",col);explain("Same signs give upward bias, opposite signs give downward bias. The table keeps every case you have finished.");}
    draw();
  }
  const sb=[button("1 Ideal",()=>go(1),true),button("2 Selection",()=>go(2)),button("3 Groups",()=>go(3)),button("4 Z → Y",()=>go(4)),button("5 Bias",()=>go(5)),button("6 Table",()=>go(6))];group(sb);
  sep();
  const sl=slider("Increase X",0,4,dx,0.1,v=>{dx=v;draw();});sl.style.width="110px";
  sep();
  const cb=CASES.map((c,i)=>button(c.btn,()=>{cs=c;dx=4;sl.value=4;sb.forEach(b=>b.classList.remove("on"));sb[0].classList.add("on");go(1);},i===0));group(cb);
  S2.frame=function(dt){const k=ez(dt,0.3);for(let i=0;i<n;i++){cur.X[i]+=(tgt.X[i]-cur.X[i])*k;cur.Y[i]+=(tgt.Y[i]-cur.Y[i])*k;pts[i].setAttribute("cx",px(cur.X[i]));pts[i].setAttribute("cy",py(cur.Y[i]));}};
  // the guide: parts of the screen appear one at a time, each with a note, until all of it is showing
  const AP={x:60,y:125,w:830,h:675},AD={x:935,y:128,w:625,h:136},AI={x:935,y:266,w:625,h:136},AN={x:935,y:406,w:625,h:144},AB={x:935,y:552,w:625,h:150},AC={x:60,y:800,w:1480,h:72};
  function stops(){const c=cs;return [
    {a:AP,bx:935,by:230,t:"The picture",s:"Each dot is one person. Across is "+c.x+" (X). Up is "+c.y+" (Y). Dark dots: "+c.hi+". Pale dots: "+c.lo+". That is the omitted variable Z."},
    {a:AP,bx:935,by:230,t:"The blue line",s:"This is the causal effect of X on Y: what an ideal experiment would find. The blue dot sits at the current X. In step 5 an orange line joins it, the slope when Z is left out."},
    {a:AD,bx:935,by:440,t:"The map",s:"X → Y is the effect we want. Z is the omitted variable. A sign appears on each orange link once we know it: Z and X in step 3, Z and Y in step 4."},
    {a:AI,bx:935,by:440,t:"Who is at this X",s:"Each row shows ten people at one value of X: the starting X on top, the current X below. The % is the share of dark. Watch whether the mix changes when X goes up."},
    {a:AN,bx:935,by:562,t:"The numbers",s:"One line now, the causal effect. Steps 3, 4 and 5 add a line each, and they end with the bias."},
    {a:AB,bx:300,by:430,t:"The bars",s:"When X goes up, how much does Y change? Blue is X itself. Orange is the part through Z. Black is the total with Z left out. The last two come on in step 5."},
    {a:AC,bx:330,by:560,t:"The words",s:"The bottom lines say what the current step shows."},
    {a:null,bx:330,by:500,t:"The controls",s:"Left: the six steps, in order. Middle: the slider that increases X. Right: the six cases. Click a step or a case to begin. Guide replays this tour."}];}
  let tourG=null;
  function endTour(){if(!tourG)return;tourG.remove();tourG=null;ctl.style.outline="";ctl.style.opacity="";ctl.style.pointerEvents="";ctl.removeEventListener("click",endTour,true);}
  function startTour(){endTour();cur.X=tgt.X.slice();cur.Y=tgt.Y.slice();
    tourG=el("g",{});const S=stops();let k=0;
    const cover=el("path",{fill:"#FFFFFF","fill-rule":"evenodd"},tourG),edge=el("rect",{fill:"none",stroke:C.orange,"stroke-width":3,rx:8},tourG);
    const card=el("rect",{width:610,rx:10,fill:"#fff",stroke:C.blue,"stroke-width":2},tourG),hd=txt(0,0,"",{"font-size":26,"font-weight":700,fill:C.blue},tourG),body=txt(0,0,"",{"font-size":21,fill:C.ink},tourG),more=txt(0,0,"",{"font-size":17,fill:C.grey},tourG);
    tourG.style.cursor="pointer";
    function show1(){const s=S[k],seen=[];S.slice(0,k+1).forEach(v=>{if(v.a&&!seen.includes(v.a))seen.push(v.a);});
      const R=(x,y,w,h)=>"M"+x+" "+y+"h"+w+"v"+h+"h"+(-w)+"z";
      cover.setAttribute("d",R(0,118,1600,782)+seen.map(a=>R(a.x,a.y,a.w,a.h)).join(""));
      edge.style.display=s.a?"":"none";if(s.a){edge.setAttribute("x",s.a.x);edge.setAttribute("y",s.a.y);edge.setAttribute("width",s.a.w);edge.setAttribute("height",s.a.h);}
      const last=!s.a;ctl.style.opacity=last?"":"0.15";ctl.style.pointerEvents=last?"":"none";ctl.style.outline=last?"3px solid "+C.orange:"";
      while(body.firstChild)body.removeChild(body.firstChild);
      const X=s.bx+24,lines=[];let line="";s.s.split(" ").forEach(v=>{if((line+" "+v).length>50){lines.push(line);line=v;}else line=line?line+" "+v:v;});if(line)lines.push(line);
      hd.textContent=s.t+"  ("+(k+1)+" of "+S.length+")";hd.setAttribute("x",X);hd.setAttribute("y",s.by+42);
      body.setAttribute("x",X);body.setAttribute("y",s.by+78);lines.forEach((t,i)=>{const e=el("tspan",{x:X,dy:i?29:0},body);e.textContent=t;});
      const h=78+29*(lines.length-1)+52;
      more.textContent=last?"Click the picture, a step or a case to close the guide":"Click anywhere to continue";more.setAttribute("x",X);more.setAttribute("y",s.by+h-16);
      card.setAttribute("x",s.bx);card.setAttribute("y",s.by);card.setAttribute("height",h);}
    tourG.addEventListener("click",()=>{k++;if(k>=S.length)endTour();else show1();});
    ctl.addEventListener("click",endTour,true);
    show1();}
  S2.cleanup=endTour;
  button("Guide",()=>{sb.forEach(b=>b.classList.remove("on"));sb[0].classList.add("on");dx=4;sl.value=4;go(1);startTour();});
  go(1);
  S2.toured||(S2.toured=true,startTour());
};

/* ===================================================================== */
const SCENES=[S1,S2];let cur=0,last=performance.now();
function show(i){hideTip();if(SCENES[cur].cleanup)SCENES[cur].cleanup();cur=(i+SCENES.length)%SCENES.length;svg.innerHTML="";ctl.innerHTML="";capEl=null;SCENES[cur].frame=null;SCENES[cur].build();
  svg.style.animation="none";void svg.getBoundingClientRect();svg.style.animation="fadein .35s ease-out";}
function tick(t){const dt=Math.min(0.1,Math.max(0,(t-last)/1000));last=t;if(SCENES[cur].frame)SCENES[cur].frame(dt);}
function loop(t){tick(t);requestAnimationFrame(loop);}
// backstop when requestAnimationFrame is throttled (hidden tabs)
setInterval(()=>{const t=performance.now();if(t-last>250)tick(t);},250);
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")show(cur+1);else if(e.key==="ArrowLeft")show(cur-1);else if(e.key==="i"||e.key==="I")toggleInfo();else if(e.key==="f"||e.key==="F"){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();}});
show(0);requestAnimationFrame(loop);
</script>
