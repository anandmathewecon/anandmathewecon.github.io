  return d;
}
function stepA(now){
  if(A.playing && !A.done){
    for(let k=0;k<A.speed && A.i<R.length;k++,A.i++){
      const r=R[A.i], y=Y[A.i]; A.cnt[r]++; A.sum[r]+=y; A.tot+=y;
      const d=dotFor(r); d.tx=A.sx(A.cnt[r]); d.ty=A.sy(A.sum[r]/A.cnt[r]);
      if(r===CLARK && y>=40){ const p=txt(d.tx+16,d.ty-34,"+"+y+" yards",{s:24,w:700,f:C.orange,a:"start",op:1},A.top); A.pops.push({p,t0:now}); A.playing=false; setTimeout(()=>{A.playing=true;},1400); }
    }
    if(A.i>=R.length){A.done=true; caption("The extreme averages all belong to rushers with only a few carries.",C.orange);}
  }
  // weeks and counts
  let w=1; for(let j=0;j<WEEKSTART.length;j++) if(A.i>=WEEKSTART[j]) w=j+1;
  A.week.textContent="Week "+w; A.count.textContent=A.i.toLocaleString()+" of "+R.length.toLocaleString()+" carries";
  if(A.i>0){const m=A.tot/A.i; A.avgLine.setAttribute("y1",A.sy(m)); A.avgLine.setAttribute("y2",A.sy(m)); A.avgLab.setAttribute("y",A.sy(m));}
  if(A.frame++%12===0) sdReadout();
  // move dots: ease toward target, plus a small drift so nothing is ever still
  for(let r=0;r<NR;r++){ const d=A.dots[r]; if(!d) continue;
    d.x+= (d.tx-d.x)*0.16; d.y+=(d.ty-d.y)*0.16;
    const bx=Math.sin(now/2600+A.ph[r])*A.dr[r], by=Math.cos(now/3100+A.ph[r]*1.3)*A.dr[r];
    d.c.setAttribute("cx",(d.x+bx).toFixed(1)); d.c.setAttribute("cy",(d.y+by).toFixed(1));
    if(d.hi){ const l=A.lab[r]; l.setAttribute("x",(d.x+14).toFixed(1)); l.setAttribute("y",(d.y+(r===CLARK?-16:18)).toFixed(1)); }
  }
  A.pops=A.pops.filter(o=>{const k=(now-o.t0)/2600; o.p.setAttribute("opacity",Math.max(0,1-k)); return k<1 || (o.p.remove(),false);});
}
function sdReadout(){
  const sm=[],bg=[];
  for(let r=0;r<NR;r++){const n=A.cnt[r]; if(!n) continue; const a=A.sum[r]/n; if(n<=5) sm.push(a); else if(n>=50) bg.push(a);}
  const sd=v=>{ if(v.length<2) return null; const m=v.reduce((s,x)=>s+x,0)/v.length; return Math.sqrt(v.reduce((s,x)=>s+(x-m)*(x-m),0)/(v.length-1)); };
  const a=sd(sm), b=sd(bg);
  A.sdSmall.textContent="1 to 5 carries: "+(a===null?"–":a.toFixed(1)+" yards")+"  ("+sm.length+" rushers)";
  A.sdBig.textContent="50 or more carries: "+(b===null?"none yet":b.toFixed(1)+" yards")+"  ("+bg.length+" rushers)";
}

/* =====================================================================
   SCENE 2: more data shrinks the scatter, not the bias
   ===================================================================== */
const B={};
const NS_=[4,16,64,256,1024];
function startB(){
  clear(); fades=[]; captionEl=null;
  header("More data shrinks the scatter. Does it fix the aim?","Animation 2 of 2");
  B.k=0; B.n=NS_[0]; B.playing=true; B.last=0; B.rnd=mul(28);
  B.boards=[
    {cx:470, cy:440, bias:[0,0],     name:"a random sample",            sub:"unbiased"},
    {cx:1130,cy:440, bias:[118,-86], name:"volunteers only, like the Literary Digest", sub:"biased"}];
  B.R=230;
  B.boards.forEach(b=>{
    const g=el("g",{});
    [[1,"#F1F3F7"],[0.66,"#E4E8EF"],[0.33,"#FFFFFF"]].forEach(([f,col])=>{el("circle",{cx:b.cx,cy:b.cy,r:B.R*f,fill:col,stroke:"#CBD2DE","stroke-width":2},g);});
    el("circle",{cx:b.cx,cy:b.cy,r:10,fill:C.orange},g);
    txt(b.cx,b.cy+B.R+40,b.name,{s:23,w:600,f:"#3A4150"},g);
    b.read=txt(b.cx,b.cy+B.R+74,"",{s:19,f:C.ink},g);
    b.ring=el("circle",{cx:b.cx+b.bias[0],cy:b.cy+b.bias[1],r:60,fill:"none",stroke:C.blue,"stroke-width":2,"stroke-dasharray":"6 6",opacity:0.55},g);
    b.ringR=60; b.pts=[]; b.layer=el("g",{},g);
  });
  txt(800,150,"orange dot: the truth  ·  blue dots: the estimate from one sample  ·  dashed ring: about 2 standard errors",{s:18,f:C.ink});
  // sample-size buttons
  B.btns=[];
  NS_.forEach((n,j)=>{ const x=560+j*120, g=el("g",{class:"btn"}); const r=el("rect",{x:x-50,y:790,width:100,height:40,rx:20,fill:"#EEF1FA"},g);
    const t=txt(x,811,"n = "+n,{s:18,w:600,f:C.blue},g); g.addEventListener("click",()=>setN(j)); B.btns.push({r,t}); });
  txt(430,811,"sample size",{s:18,f:C.ink,a:"end"});
  setN(0);
}
function setN(j){
  B.k=Math.max(0,Math.min(NS_.length-1,j)); B.n=NS_[B.k];
  B.btns.forEach((b,i)=>{b.r.setAttribute("fill",i===B.k?C.blue:"#EEF1FA"); b.t.setAttribute("fill",i===B.k?"#FFFFFF":C.blue);});
  B.boards.forEach(b=>{b.pts.forEach(p=>p.c.remove()); b.pts=[];});
  const msg = B.k===0 ? "Small samples: both boards scatter widely."
            : B.k<NS_.length-1 ? "Four times the data, half the scatter."
            : "Huge samples: both clusters are tight. Only one is on target.";
  caption(msg, B.k===NS_.length-1?C.orange:C.blue);
}
const SIG=170; // spread of one observation, in pixels
function stepB(now){
  if(B.playing && now-B.last>110){
    B.last=now;
    const se=SIG/Math.sqrt(B.n);
    B.boards.forEach(b=>{
      const x=b.cx+b.bias[0]+gauss(B.rnd)*se, y=b.cy+b.bias[1]+gauss(B.rnd)*se;
      const c=el("circle",{cx:x.toFixed(1),cy:y.toFixed(1),r:6.5,fill:C.blue,opacity:0.9},b.layer);
      b.pts.push({c,t0:now}); if(b.pts.length>45){b.pts.shift().c.remove();}
    });
  }
  const se=SIG/Math.sqrt(B.n);
  B.boards.forEach(b=>{
    b.ringR+= (2*se-b.ringR)*0.08; b.ring.setAttribute("r",b.ringR.toFixed(1));
    b.pts.forEach(p=>{const age=(now-p.t0)/5000; p.c.setAttribute("opacity",Math.max(0.12,0.9-age));});
    const biasPx=Math.hypot(b.bias[0],b.bias[1]);
    b.read.textContent="typical scatter: "+se.toFixed(0)+"   ·   bias: "+biasPx.toFixed(0);
  });
}

/* =====================================================================
   driver
   ===================================================================== */
const SC=[{start:startA,step:stepA,obj:A},{start:startB,step:stepB,obj:B}];
let cur=0;
function go(i){cur=(i+SC.length)%SC.length; location.hash="#"+(cur+1); SC[cur].start();}
addEventListener("keydown",e=>{
  if(e.key==="ArrowRight"||e.key==="PageDown") go(cur+1);
  else if(e.key==="ArrowLeft"||e.key==="PageUp") go(cur-1);
  else if(e.key===" "){ e.preventDefault(); SC[cur].obj.playing=!SC[cur].obj.playing; }
  else if(e.key==="r"||e.key==="R") go(cur);
  else if(e.key==="+"||e.key==="=") { if(cur===0) A.speed=Math.min(200,Math.round(A.speed*1.6)); }
  else if(e.key==="-"||e.key==="_") { if(cur===0) A.speed=Math.max(2,Math.round(A.speed/1.6)); }
  else if(e.key==="ArrowUp") { if(cur===1){e.preventDefault(); setN(B.k+1);} }
  else if(e.key==="ArrowDown") { if(cur===1){e.preventDefault(); setN(B.k-1);} }
  else if(e.key==="f"||e.key==="F") { document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen(); }
});
addEventListener("hashchange",()=>{const i=parseInt(location.hash.slice(1))-1; if(i>=0&&i<SC.length&&i!==cur) go(i);});
go(Math.max(0,(parseInt(location.hash.slice(1))||1)-1));
(function frame(now){ SC[cur].step(now); tickFades(now); requestAnimationFrame(frame); })(performance.now());
</script>
</body>
</html>
